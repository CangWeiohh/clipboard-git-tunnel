# Clipboard Git Tunnel 启动配置
# 本文件被 start_a.bat / start_b.bat 与 a_end/a_proxy.py、b_end/b_tunnel.py 读取。
# CLI 参数 > config.yaml > 内置默认值。

# ---------------- Python 解释器 ----------------
# A/B 端各自指定解释器绝对路径；留空 "" 则使用 PATH 中的 python。
# 仅 start_a.bat / start_b.bat 使用（决定用哪个解释器启动）。
a_python: "C:\Python311\python.exe"
b_python: ""

# ---------------- A 端（start_a.bat / a_end\a_proxy.py） ----------------
# A 端 HTTP 代理监听地址。Mac IDEA 访问需监听 0.0.0.0；仅供本机可用 127.0.0.1。
a_listen: 0.0.0.0:9999
# 剪贴板单帧传输字节数（建议 800*1024≈782KiB，最大化单帧吞吐；上限约 824KiB）
a_chunk_bytes: 819200
# 每帧等待 ACK 的超时秒数
a_ack_timeout: 5
# ACK 超时后的重试次数
a_retries: 5
# 单次 HTTP 请求的总超时秒数
a_timeout: 300
# 跨请求写屏障（HSR 单槽位保护），秒；实测传播窗口最大 ~2.8s，3s 留有余量
a_write_gap: 3
# A 端允许的最大请求体字节数（默认 64MiB）
a_max_request_bytes: 67108864
# HSRClient 窗口标题关键字（逗号分隔），留空则按进程名自动发现
a_window_keywords: ""
# 日志级别：DEBUG / INFO / WARNING / ERROR
a_log_level: INFO
# 日志目录；留空 "" 则用 <项目目录>\logs
a_log_dir: ""

# ---------------- B 端（start_b.bat / b_end\b_tunnel.py） ----------------
# 内网 Git 服务地址（B 端转发目标）
b_target: 192.168.21.14:8888
b_chunk_bytes: 819200
b_ack_timeout: 5
b_retries: 5
b_timeout: 300
b_log_level: INFO
b_log_dir: ""